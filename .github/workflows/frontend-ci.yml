name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Clean up repetitive cd commands by setting a default path
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Best practice: cache against the lockfile, not package.json
          cache-dependency-path: './frontend/package-lock.json' 

      - name: Install Frontend Dependencies
        # npm ci is strictly for automated environments
        run: npm ci

      - name: TypeScript Compilation & Type Check
        run: npm run build

      - name: Lint Frontend
        run: npx eslint . --ext .ts,.tsx

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-and-test # Waits for tests to pass before building Docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only log in when merging to main/master, not on PRs
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.Docker_username }}
          password: ${{ secrets.yuvan334 }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          # Push to registry on main/master, just do a dry-run build on PRs
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.Docker_username }}/enterprise-procurement-frontend:latest
            ${{ secrets.Docker_username }}/enterprise-procurement-frontend:${{ github.sha }}
