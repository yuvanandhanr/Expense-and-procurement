name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx httpx-oauth

      - name: Run Tests
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          JWT_SECRET: testing_secret_key_for_ci
          ENVIRONMENT: testing
        run: pytest -v

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-and-test # Waits for tests to pass before building Docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only log in when merging to main, not on PRs
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.Docker_username }}
          password: ${{ secrets.yuvan334 }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Push to registry on main branch, just do a dry-run build on PRs
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.Docker_username }}/enterprise-procurement-app:latest
            ${{ secrets.Docker_username }}/enterprise-procurement-app:${{ github.sha }}
