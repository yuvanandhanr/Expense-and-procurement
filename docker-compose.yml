version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: enterprise_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_app
    ports:
      - "8080:8000"
    env_file:
      - .env
    # DATABASE_URL now comes from .env (Supabase) instead of being forced to the local db service.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # Anonymous volume to protect container site-packages in case of local overrides
      - /app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend
    ports:
      - "3001:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
