version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_app
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
      # Anonymous volume to protect container site-packages in case of local overrides
      - /app/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend
    ports:
      - "3001:80"
    depends_on:
      - app
    restart: unless-stopped
